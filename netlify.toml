# Netlify build configuration.
#
# Kept in the repo rather than in the dashboard so a deploy is reproducible
# from a clone and any change to it shows up in review.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Next 16 requires Node >= 20.9. Pinned so a change to Netlify's default
  # cannot break the build without a commit.
  NODE_VERSION = "22"

  # Base for metadataBase, canonicals, the sitemap and every JSON-LD @id.
  # `lib/seo/routes.ts` throws without it rather than shipping `undefined`
  # into production markup, so it has to exist in every context.
  NEXT_PUBLIC_SITE_URL = "https://socialgymfit.com"

[context.production.environment]
  SITE_ENV = "production"

# Security headers, applied at the edge to every response.
#
# No script-src/style-src: Next inlines its hydration payload, so restricting
# those needs a per-request nonce, which would force all 21 routes off SSG.
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No includeSubDomains until every Hostinger-side subdomain is confirmed
    # HTTPS-only.
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
