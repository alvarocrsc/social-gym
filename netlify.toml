# Netlify build configuration.
#
# Kept in the repo rather than in the dashboard so a deploy is reproducible
# from a clone and any change to it shows up in review.

[build]
  command = "npm run build"
  publish = ".next"

# Keep the media out of the serverless bundle.
#
# The Next runtime bundles the app into one function with a hard 250 MB
# ceiling, and `public/` is copied in wholesale. Netlify already publishes
# those files to the CDN, and nothing reads them at request time: every route
# is prerendered, so `existingImage` resolves during the build, and the only
# dynamic segment sets `dynamicParams = false`.
[functions]
  included_files = ["!public/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Next 16 requires Node >= 20.9. Pinned so a change to Netlify's default
  # cannot break the build without a commit.
  NODE_VERSION = "22"

  # Base for metadataBase, canonicals, the sitemap and every JSON-LD @id.
  # `lib/seo/routes.ts` throws without it rather than shipping `undefined`
  # into production markup, so it has to exist in every context.
  NEXT_PUBLIC_SITE_URL = "https://socialgym.club"

[context.production.environment]
  SITE_ENV = "production"

